name: Build APK 2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp chess.html www/index.html
          cp plus.js www/plus.js
          sed -i 's#</body>#<script>window.onerror=function(m,s,l){alert("خطأ: "+m+" @"+l)}</script><script src="plus.js"></script><script>if(!document.getElementById("nv"))alert("plus.js لم يعمل")</script></body>#' www/index.html
          npx cap init "شطرنج 2" com.shatranj.two --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chess2-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
